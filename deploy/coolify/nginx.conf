# Une seule adresse pour les moteurs de recherche : www mène au domaine principal.
server {
    listen 8080;
    server_name www.alco-one.com;
    return 301 https://alco-one.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière le proxy de Coolify : les redirections restent relatives, en HTTPS.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain;

    # Tout est intégré à la page. connect-src 'self' : à compléter si ENVOI_URL vise un autre domaine.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; font-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Le navigateur revalide : une nouvelle version est vue dès son déploiement.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # L'ancienne adresse de la version 8 mène à la racine.
    location = /v8 { return 301 /; }
    location = /v8/ { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
    }
}
